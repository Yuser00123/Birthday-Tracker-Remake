<!DOCTYPE html>
<html>
    <head>
        <title>Birthday OS</title>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
    </head>
    <body>
        <header class="site-header">
            <h1>Birthday OS</h1>
            <p class="tagline">Keep track of everyone's birthday here.</p>
        </header>

        <main>
            <section class="panel hero" id="hero" hidden>
                <p class="hero-label">Next Up</p>
                <h2 class="hero-name">Nobody Yet</h2>
                <p class="hero-date" id="hero-date"></p>

                <p class="hero-note" id="hero-note" aria-live="polite"></p>
                <div class="countdown" id="countdown" aria-hidden="true">
                    <div class="countdown-box">
                        <span id="cd-days">0</span>
                        <small>days</small>
                    </div>
                    <div class="countdown-box">
                        <span id="cd-hours">0</span>
                        <small>hours</small>
                    </div>
                    <div class="countdown-box">
                        <span id="cd-minutes">0</span>
                        <small>mins</small>
                    </div>
                    <div class="countdown-box">
                        <span id="cd-seconds">0</span>
                        <small>secs</small>
                    </div>
                </div>

                <div class="hero-actions">
                    <button type="button" class="secondary small" id="hero-life-btn">See their life grid</button>
                </div>
            </section>
            <p class="empty" id="empty-state">
                No birthdays saved yet. Add using form below.
            </p>

            <section class="panel">
                <div class="panel-head">
                    <h2>Everyone</h2>
                    <div class="filters">
                        <input type="search" id="search" placeholder="Search names">
                        <select id="filter" aria-label="Filter birthdays">
                            <option value="all">Everyone</option>
                            <option value="week">Next 7 days</option>
                            <option value="month">This month</option>
                        </select>
                    </div>
                </div>

                <ul class="people-list" id="people-list"></ul>
                <p class="hint" id="list-hint"></p>
            </section>

            <section class="panel">
                <h2 id="form-title">Add someone</h2>
                <form id="person-form" novalidate>
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" maxlength="40" placeholder="Ana" autocomplete="off">

                    <label for="birthday">Birthday</label>
                    <input type="date" id="birthday" name="birthday">

                    <label for="note">Note <span class="optional">(optional)</span></label>
                    <input type="text" id="note" name="note" maxlength="60" placeholder="School friend" autocomplete="off">

                    <p class="form-error" id="form-error" role="alert"></p>
                    <div class="form-actions">
                        <button type="submit" id="submit-btn">Add birthday</button>
                        <button type="button" class="secondary" id="cancel-edit" hidden>Cancel</button>
                    </div>
                </form>

                <p class="hint">The month and day are what the countdown needs. Add the year too if you want to see ages.</p>
                
            </section>
        </main>
    </body>
</html>
